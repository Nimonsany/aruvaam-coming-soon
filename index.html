<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020718">
  <meta name="description" content="ARUVAAM — We're on the way. Coming soon.">
  <title>ARUVAAM | Coming Soon</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(245,158,11,.10), transparent 28%),
        #020718;
      color: #f7c34d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
    }
    main {
      width: min(92vw, 920px);
      text-align: center;
      padding: 40px 20px;
      animation: enter .9s ease-out both;
    }
    .logo {
      display: block;
      width: min(88vw, 720px);
      max-height: 58vh;
      margin: 0 auto 28px;
      object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(245,158,11,.16));
    }
    .eyebrow {
      margin: 0 0 10px;
      color: #a8afc0;
      font-size: clamp(.78rem, 1.5vw, 1rem);
      font-weight: 700;
      letter-spacing: .34em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 6vw, 4.6rem);
      font-weight: 500;
      letter-spacing: .10em;
      background: linear-gradient(90deg, #ffe27a, #ff9d00);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .line {
      width: 72px;
      height: 1px;
      margin: 25px auto 0;
      background: linear-gradient(90deg, transparent, #f59e0b, transparent);
    }
    footer {
      position: fixed;
      bottom: 18px;
      left: 0;
      right: 0;
      text-align: center;
      color: #667085;
      font-size: .72rem;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    @keyframes enter {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 600px) {
      main { padding: 28px 14px; }
      .logo { width: min(94vw, 560px); margin-bottom: 20px; }
      .eyebrow { letter-spacing: .24em; }
      h1 { letter-spacing: .06em; }
    }
    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="aruvaam-logo.svg" alt="ARUVAAM">
    <p class="eyebrow">We're on the way</p>
    <h1>COMING SOON</h1>
    <div class="line" aria-hidden="true"></div>
  </main>
  <footer>www.aruvaam.com</footer>
</body>
</html>
