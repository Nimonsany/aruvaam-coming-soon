<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%" height="100%" id="aruvaam-svg-main">
            
        <defs>
          <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fef08a" /><stop offset="40%" stop-color="#f59e0b" /><stop offset="80%" stop-color="#b45309" /><stop offset="100%" stop-color="#78350f" />
          </linearGradient>
          <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#fbbf24" />
          </linearGradient>
          <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#fef08a" />
            <stop offset="50%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#d97706" />
          </linearGradient>
          
        <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="5.333333333333333" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      
        </defs>
      
            <!-- Trishul Icon Symbol (Centered Top) -->
            <g transform="translate(200, 20)" filter="url(#auraGlow)">
              
          <!-- Center Blade -->
          <path d="M 200 70 L 200 290" stroke="url(#primaryGrad)" stroke-width="3.75" stroke-linecap="round"/>
          <path d="M 190 120 L 200 60 L 210 120 C 206 100 194 100 190 120 Z" fill="url(#primaryGrad)"/>
          
          <!-- Outer Prongs (Symmetrical Curves) -->
          <path d="M 145 130 C 145 220 180 230 200 230 C 220 230 255 220 255 130" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round"/>
          
          <!-- Left Blade Tip -->
          <path d="M 138 140 L 145 120 L 152 140 C 149 130 141 130 138 140 Z" fill="url(#primaryGrad)"/>
          
          <!-- Right Blade Tip -->
          <path d="M 248 140 L 255 120 L 262 140 C 259 130 251 130 248 140 Z" fill="url(#primaryGrad)"/>
          
          <!-- Integrated Third Eye Crescent -->
          <path d="M 188 175 A 12 12 0 0 0 212 175 A 10 10 0 0 1 188 175 Z" fill="url(#accentGrad)"/>
          <!-- Third Eye Flame -->
          <path d="M 200 156 C 204 163 205 167 200 172 C 195 167 196 163 200 156 Z" fill="url(#accentGrad)"/>
          
          <!-- Base Sacred Ring Accent -->
          <circle cx="200" cy="245" r="5" fill="url(#primaryGrad)"/>
          <path d="M 185 260 L 215 260" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-linecap="round"/>
        
            </g>

            <!-- Brand Name Typography -->
            <g transform="translate(400, 390)">
              <text x="0" y="0" 
                text-anchor="middle" 
                fill="url(#textGrad)" 
                font-family="'Cinzel', serif" 
                font-size="52" 
                font-weight="700" 
                letter-spacing="12px">
                ARUVAAM
              </text>
              
                <text x="0" y="42" 
                  text-anchor="middle" 
                  fill="#94a3b8" 
                  font-family="'Plus Jakarta Sans', sans-serif" 
                  font-size="14" 
                  font-weight="600" 
                  letter-spacing="6px" 
                  opacity="0.85">
                  WWW.ARUVAAM.COM
                </text>
              
            </g>
          </svg>